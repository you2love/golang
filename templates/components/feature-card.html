<!-- 特性卡片网格组件 -->
<div class="feature-grid">
    {{#FEATURES}}
    <div class="feature-card">
        <div class="icon">{{ICON}}</div>
        <h4>{{TITLE}}</h4>
        <p>{{DESCRIPTION}}</p>
        {{#CODE}}<code class="tag">{{CODE}}</code>{{/CODE}}
    </div>
    {{/FEATURES}}
</div>
