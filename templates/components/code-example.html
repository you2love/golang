<!-- 代码示例组件 -->
<div class="code-example">
    {{#TITLE}}<h3>{{TITLE}}</h3>{{/TITLE}}
    <pre><code class="language-go">{{CODE}}</code></pre>
    {{#EXPLANATION}}
    <p class="code-explanation">{{EXPLANATION}}</p>
    {{/EXPLANATION}}
</div>
