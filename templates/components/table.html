<!-- 对比表格组件 -->
<table class="comparison-table">
    {{#CAPTION}}<caption>{{CAPTION}}</caption>{{/CAPTION}}
    <thead>
        <tr>
            {{#HEADERS}}
            <th>{{.}}</th>
            {{/HEADERS}}
        </tr>
    </thead>
    <tbody>
        {{#ROWS}}
        <tr>
            {{#cells}}
            <td>{{.}}</td>
            {{/cells}}
        </tr>
        {{/ROWS}}
    </tbody>
</table>
